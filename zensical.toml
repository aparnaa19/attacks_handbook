[project]
site_url = "https://aparnaa19.github.io/attacks_handbook/"
site_name = "SOC Attack Handbook"
site_description = "Theory handbook of the attacks a SOC analyst needs to know: how each attack works, what it looks like in logs, how to detect it and how to respond."
repo_url = "https://github.com/aparnaa19/attacks_handbook"
repo_name = "aparnaa19/attacks_handbook"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Basics" = [
    { "Attack lifecycle" = "basics/attack-lifecycle.md" },
    { "Key SOC terms" = "basics/key-terms.md" },
  ] },
  { "Quick reference" = [
    { "I see X, what is it?" = "reference/symptom-lookup.md" },
    { "Windows event IDs" = "reference/windows-event-ids.md" },
    { "Sysmon event IDs" = "reference/sysmon-event-ids.md" },
    { "Linux logs" = "reference/linux-logs.md" },
    { "Log sources" = "reference/log-sources.md" },
    { "Common ports" = "reference/common-ports.md" },
  ] },
  { "Initial access" = [
    "initial-access/index.md",
    { "Phishing" = "initial-access/phishing.md" },
    { "Business email compromise" = "initial-access/business-email-compromise.md" },
    { "Social engineering" = "initial-access/social-engineering.md" },
    { "Drive-by compromise" = "initial-access/drive-by-compromise.md" },
    { "Exploiting public-facing apps" = "initial-access/exploit-public-facing-app.md" },
    { "Supply chain attack" = "initial-access/supply-chain.md" },
  ] },
  { "Credential attacks" = [
    "credential-attacks/index.md",
    { "Brute force" = "credential-attacks/brute-force.md" },
    { "Password spraying" = "credential-attacks/password-spraying.md" },
    { "Credential stuffing" = "credential-attacks/credential-stuffing.md" },
    { "MFA fatigue" = "credential-attacks/mfa-fatigue.md" },
    { "Credential dumping" = "credential-attacks/credential-dumping.md" },
    { "DCSync" = "credential-attacks/dcsync.md" },
    { "Pass-the-hash" = "credential-attacks/pass-the-hash.md" },
    { "Pass-the-ticket" = "credential-attacks/pass-the-ticket.md" },
    { "Kerberoasting" = "credential-attacks/kerberoasting.md" },
    { "AS-REP roasting" = "credential-attacks/as-rep-roasting.md" },
    { "Golden and silver ticket" = "credential-attacks/golden-silver-ticket.md" },
  ] },
  { "Malware" = [
    "malware/index.md",
    { "Ransomware" = "malware/ransomware.md" },
    { "Trojans and RATs" = "malware/trojans-and-rats.md" },
    { "Worms" = "malware/worms.md" },
    { "Infostealers" = "malware/infostealers.md" },
    { "Fileless malware" = "malware/fileless-malware.md" },
    { "PowerShell abuse" = "malware/powershell-abuse.md" },
    { "LOLBins" = "malware/lolbins.md" },
  ] },
  { "Web attacks" = [
    "web-attacks/index.md",
    { "SQL injection" = "web-attacks/sql-injection.md" },
    { "Cross-site scripting (XSS)" = "web-attacks/xss.md" },
    { "Command injection" = "web-attacks/command-injection.md" },
    { "Path traversal and LFI" = "web-attacks/path-traversal.md" },
    { "SSRF" = "web-attacks/ssrf.md" },
    { "CSRF" = "web-attacks/csrf.md" },
    { "IDOR" = "web-attacks/idor.md" },
    { "File upload and web shells" = "web-attacks/file-upload-web-shell.md" },
  ] },
  { "Network attacks" = [
    "network-attacks/index.md",
    { "Reconnaissance and scanning" = "network-attacks/reconnaissance-scanning.md" },
    { "DoS and DDoS" = "network-attacks/dos-ddos.md" },
    { "MITM and ARP spoofing" = "network-attacks/mitm-arp-spoofing.md" },
    { "LLMNR / NBT-NS poisoning" = "network-attacks/llmnr-nbtns-poisoning.md" },
    { "DNS tunneling" = "network-attacks/dns-tunneling.md" },
    { "C2 beaconing" = "network-attacks/c2-beaconing.md" },
  ] },
  { "Post-exploitation" = [
    "post-exploitation/index.md",
    { "Privilege escalation" = "post-exploitation/privilege-escalation.md" },
    { "Persistence" = "post-exploitation/persistence.md" },
    { "Lateral movement" = "post-exploitation/lateral-movement.md" },
    { "Defense evasion" = "post-exploitation/defense-evasion.md" },
    { "Data exfiltration" = "post-exploitation/data-exfiltration.md" },
  ] },
  { "Cloud and identity" = [
    "cloud-identity/index.md",
    { "Session token theft (AiTM)" = "cloud-identity/session-token-theft.md" },
    { "OAuth consent phishing" = "cloud-identity/oauth-consent-phishing.md" },
    { "Cloud misconfiguration" = "cloud-identity/cloud-misconfiguration.md" },
  ] },
  { "Insider threat" = "insider-threat/index.md" },
]

extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
